<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1220">
    <title>都留高男子バスケ部の軌跡 (保護者・OB用)</title>
    <!-- ⚡ 通信先への接続を先に始めておく（初回表示の短縮） -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js">
    <!-- ⚡ defer: カレンダー部品の読み込みで画面表示を止めない -->
    <script defer src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #e3f2fd; font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; -webkit-tap-highlight-color: transparent; }
        .container { display: flex; flex-direction: column; height: 100%; max-width: 600px; width: 100%; margin: 0 auto; background: white; box-shadow: 0 0 15px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 20px;}
        .app-header { flex-shrink: 0; background: linear-gradient(135deg, #1565c0 0%, #1e88e5 100%); color: white; padding: 15px; text-align: center; z-index: 10; }
        .app-header h1 { margin: 0; font-size: 18px; letter-spacing: 1px; }
        
        .tabs { flex-shrink: 0; display: flex; background: #fff; border-bottom: 1px solid #eee; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; z-index: 9; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-button { flex: 0 0 auto; padding: 12px 16px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; border-radius: 20px; background: #f0f0f0; color: #666; transition: 0.3s; white-space: nowrap; }
        .tab-button.active { color: #1565c0; border-bottom: 3px solid #1565c0; }
        
        #authArea, #mainArea { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .tab-content { display: none; flex: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; padding-bottom: 40px; }
        .tab-content.active { display: block; }
        
        .filter-bar { display: flex; align-items: center; gap: 8px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 15px; border: 1px solid #eee; flex-wrap: wrap; }
        .filter-label { font-weight: bold; color: #1565c0; font-size: 13px; white-space: nowrap; }
        .filter-select { flex: 1; min-width: 120px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; background: #fafafa; outline: none; }
        .filter-btn { padding: 8px 12px; background: #eceff1; border: none; border-radius: 6px; cursor: pointer; color: #333; font-weight: bold; font-size: 12px; transition: 0.2s; white-space: nowrap; }
        
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; letter-spacing: 5px;}
        .btn { padding: 12px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%); transition: 0.2s;}
        .btn:active { opacity: 0.8; transform: scale(0.98); }
        .btn-outline { background: white; color: #1565c0; border: 1px solid #1565c0; }
        .btn-compact { padding: 4px 8px; font-size: 11px; min-width: auto; height: fit-content; margin-top: 0; box-shadow: none; border-radius: 4px;}
        
        .schedule-card { border: 1px solid #eee; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fafafa; }
        
        .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; border: 1px solid #eee; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; white-space: nowrap; }
        th, td { border-bottom: 1px solid #eee; border-right: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #1565c0; color: white; position: sticky; top: 0; z-index: 1;}
        
        .match-card { background: white; border: 1px solid #eee; border-left: 6px solid #1565c0; padding: 15px; margin-bottom: 15px; border-radius: 8px; position: relative; }
        .comment-box { background:#f5f5f5; padding:12px; border-radius:8px; margin-bottom:8px; font-size:14px; text-align:left; border-left:4px solid #ccc; line-height: 1.4;}
        .comment-teacher { background:#e3f2fd; border-left:4px solid #1565c0; }
        .user-header { display: flex; justify-content: flex-end; align-items: center; background: #e3f2fd; padding: 10px 15px; border-bottom: 1px solid #bbdefb; font-size: 13px; font-weight: bold; flex-shrink: 0;}
        
        #calendar, #calendarView { background: white; padding: 5px; border-radius: 8px; border: 1px solid #eee; font-size: 12px; }
        .fc-event-title { font-size: 10px; font-weight: bold; white-space: normal !important; line-height: 1.2; }
        .fc-toolbar-title { font-size: 1.1em !important; }
        .fc-button { padding: 0.3em 0.5em !important; font-size: 0.9em !important; }
    </style>
    <style id="theme">
        /* ===== 🎨 テーマ色（このアプリ専用） ===== */
        :root { --accent: #2563eb; --accent-dark: #1e3a8a; --accent-soft: #eff6ff; --accent-line: #dbeafe; --accent-ring: rgba(37,99,235,.18); --accent-bright: #93c5fd; --role: "保護者・OB"; }
        /* ===== 🎨 デザインテーマ（共通） ===== */
        :root {
            --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --line: #e8ecf1; --bg: #f3f5f8; --card: #ffffff;
            --radius: 16px; --radius-sm: 12px;
            --shadow: 0 1px 2px rgba(15,23,42,.05), 0 6px 20px rgba(15,23,42,.06);
            --fc-border-color: #edf0f4; --fc-today-bg-color: var(--accent-soft); --fc-neutral-bg-color: #f8fafc;
            --fc-button-bg-color: #fff; --fc-button-border-color: var(--line); --fc-button-text-color: var(--ink-2);
            --fc-button-hover-bg-color: var(--accent-soft); --fc-button-hover-border-color: var(--line);
            --fc-button-active-bg-color: var(--accent); --fc-button-active-border-color: var(--accent);
        }
        html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; -webkit-font-smoothing: antialiased; }
        .container { background: var(--bg); box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(15,23,42,.08); padding-bottom: 0; }

        /* ヘッダー：濃紺 × チームカラーのグラデーション */
        .app-header { position: relative; overflow: hidden; text-align: left; padding: 18px 20px 16px; padding-top: max(18px, env(safe-area-inset-top));
            background: radial-gradient(120% 140% at 100% 0%, var(--accent) 0%, transparent 55%), linear-gradient(135deg, #0b1220 0%, var(--accent-dark) 100%); }
        .app-header::after { content: ""; position: absolute; right: -36px; top: -36px; width: 140px; height: 140px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.12); box-shadow: inset 0 0 0 30px rgba(255,255,255,.03); pointer-events: none; }
        .app-header h1 { font-size: 17px; font-weight: 800; letter-spacing: .04em; display: flex; flex-direction: column; gap: 4px; }
        .app-header h1::before { content: var(--role); align-self: flex-start; font-size: 10px; font-weight: 700; letter-spacing: .12em; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.16); color: rgba(255,255,255,.92); }
        #authStatus { text-align: left !important; }

        /* ユーザー行 */
        .user-header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; color: var(--ink-2); font-weight: 700; }
        .user-header .btn-compact { background: #f1f5f9 !important; color: var(--muted) !important; border-radius: 999px !important; padding: 6px 14px !important; font-weight: 700; }

        /* タブ：スクロールできるピル型 */
        .tabs { background: var(--card); border-bottom: 1px solid var(--line); gap: 6px; padding: 8px 12px; }
        .tab-button { padding: 8px 14px; border-radius: 999px; border: none !important; background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; margin: 0; }
        .tab-button.active { background: var(--accent-soft); color: var(--accent-dark); border: none !important; box-shadow: inset 0 0 0 1px var(--accent-line); }

        .tab-content { padding: 16px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }

        /* カード類 */
        .schedule-card, .form-area, .filter-bar, .match-card, .practice-menu-card, #calendar, #calendarView, #calendarInput {
            background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
        .schedule-card { padding: 16px; }
        .form-area { padding: 18px; }
        .filter-bar { padding: 10px 12px; gap: 10px; }
        .filter-label { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
        h3, h4 { letter-spacing: .02em; }

        /* 入力欄 */
        input[type="text"], input[type="password"], input[type="number"], input[type="url"], input[type="date"], input[type="time"], select, textarea, .filter-select {
            border: 1px solid #dfe4ea !important; border-radius: var(--radius-sm) !important; background: #f8fafc !important; color: var(--ink); font-family: inherit;
            transition: border-color .15s, box-shadow .15s, background .15s; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent) !important; background: #fff !important; box-shadow: 0 0 0 4px var(--accent-ring) !important; }
        .form-group label.title { color: var(--ink-2); font-size: 12px; letter-spacing: .04em; }

        /* ボタン */
        .btn { border-radius: var(--radius-sm); font-weight: 800; letter-spacing: .03em; box-shadow: 0 1px 2px rgba(15,23,42,.08); transition: transform .1s, filter .15s, box-shadow .15s; }
        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: scale(.98); opacity: 1; }
        .btn-primary { background: var(--accent); box-shadow: 0 6px 16px var(--accent-ring); }
        .btn-success { background: #22c55e; } .btn-danger { background: #ef4444; } .btn-secondary { background: #64748b; }
        .btn-outline, .filter-btn { background: var(--accent-soft); color: var(--accent-dark); border: 1px solid var(--accent-line); box-shadow: none; }
        .btn-compact { border-radius: 999px; }
        .btn:disabled { background: #cbd5e1 !important; box-shadow: none; }

        /* 出欠ボタン */
        .status-options span { border-radius: var(--radius-sm); background: #f1f5f9; color: #94a3b8; }

        /* 表 */
        .table-wrap { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); }
        table { font-size: 13px; }
        th { background: #f8fafc !important; color: var(--muted) !important; font-size: 11px; font-weight: 800; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
        th, td { border-right: none; border-bottom: 1px solid #f1f3f6; padding: 10px 8px; }
        tr:last-child td { border-bottom: none; }

        /* 試合カード：スコアボード */
        .match-card { border-left: none; padding: 16px; overflow: hidden; }
        .match-card::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
        .match-card { position: relative; }
        .mc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 56px; }
        .mc-type { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); }
        .mc-type.official { background: #fee2e2; color: #b91c1c; }
        .mc-date { font-size: 12px; color: var(--muted); font-weight: 700; }
        .mc-name { font-size: 15px; font-weight: 800; margin-top: 6px; color: var(--ink); }
        .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 14px 0; padding: 14px 10px; border-radius: 14px; background: linear-gradient(135deg, #0b1220, #1e293b); color: #fff; }
        .sb-team { text-align: center; min-width: 0; }
        .sb-name { font-size: 12px; font-weight: 700; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sb-score { font-size: 34px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
        .sb-team.ours .sb-score { color: var(--accent-bright); }
        .sb-result { font-size: 11px; font-weight: 900; letter-spacing: .1em; padding: 4px 10px; border-radius: 999px; }
        .sb-result.win { background: #22c55e; color: #fff; } .sb-result.lose { background: #475569; color: #e2e8f0; } .sb-result.draw { background: #f59e0b; color: #fff; }

        /* コメント：チャット風 */
        .comment-box { background: #f8fafc; border: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 14px; border-top-left-radius: 4px; padding: 12px 14px; }
        .comment-teacher { background: var(--accent-soft); border-color: var(--accent-line); border-left: 1px solid var(--accent-line); }

        /* カレンダー */
        #calendar, #calendarView, #calendarInput { padding: 10px 8px; font-size: 12px; }
        .fc .fc-toolbar.fc-header-toolbar { margin-bottom: 10px; }
        .fc .fc-toolbar-title { font-size: 16px !important; font-weight: 800; color: var(--ink); }
        .fc .fc-button { border-radius: 10px !important; box-shadow: none !important; font-weight: 700; }
        .fc .fc-button-primary:disabled { background: var(--accent-soft); color: var(--accent-dark); border-color: var(--accent-line); opacity: 1; }
        .fc .fc-col-header-cell { background: transparent !important; }
        .fc .fc-col-header-cell-cushion { color: var(--muted); font-size: 11px; font-weight: 800; padding: 6px 0; text-decoration: none; }
        .fc .fc-col-header-cell.fc-day-sun .fc-col-header-cell-cushion { color: #ef4444; }
        .fc .fc-col-header-cell.fc-day-sat .fc-col-header-cell-cushion { color: #3b82f6; }
        .fc .fc-scrollgrid { border-radius: 12px; overflow: hidden; }
        .fc .fc-daygrid-day-number { color: var(--ink-2); text-decoration: none; font-weight: 700; }
        .fc .fc-day-other .fc-daygrid-day-top { opacity: .35; }
        .fc .fc-daygrid-day.fc-day-today { background: var(--accent-soft) !important; }
        .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number { color: var(--accent-dark); }
        .fc .fc-daygrid-event { border: none; border-radius: 6px; overflow: hidden; margin: 1px 2px 0; }
        .fc .fc-daygrid-event > div { border-radius: 6px !important; }

        /* ログイン画面 */
        #loginArea, #authArea { padding: 28px 20px !important; }
        #loginArea::before, #loginForm::before, #registerForm::before { content: "🏀"; display: block; width: 64px; height: 64px; margin: 4px auto 14px; border-radius: 20px; font-size: 32px; line-height: 64px; text-align: center; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
        #loginArea { background: var(--bg); }

        /* その他バッジ */
        .stat-col-badge { background: #f1f5f9; border: 1px solid var(--line); }
        .btn { background: var(--accent); }
        .btn.btn-outline { background: var(--accent-soft); }
    </style>
</head>
<body>
<div class="container">
    <div class="app-header"><h1>🏀 都留高男子バスケ部の軌跡</h1></div>

    <div id="loginArea" style="padding: 30px 20px; overflow-y:auto;">
        <p style="text-align:center; font-size:14px; color:#555; font-weight:bold; margin-bottom:20px;">関係者用閲覧アプリです。<br>パスワードを入力してください。</p>
        <div class="form-group"><input type="number" id="viewerPass" placeholder="4桁の数字を入力"></div>
        <button class="btn" onclick="window.login()">ログイン</button>
        <p id="msg-login" style="color:#d32f2f; text-align:center; font-weight:bold; font-size:14px; margin-top:15px;"></p>
    </div>

    <div id="mainArea" style="display: none;">
        <div class="user-header">
            <button class="btn-compact" style="background:#9e9e9e; color:white; border:none;" onclick="window.logout()">ログアウト</button>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="window.openTab(event, 'tab-view-schedule')">📅 予定閲覧</button>
            <button class="tab-button" onclick="window.openTab(event, 'tab-view-match')">📊 試合閲覧</button>
        </div>

        <!-- 予定閲覧 -->
        <div id="tab-view-schedule" class="tab-content active">
            <!-- 📢 顧問からの連絡枠 -->
            <div id="noticeArea" class="schedule-card" style="display:none; border-left:5px solid #ff9800; background:#fff3e0; margin-bottom:15px; margin-top:0;">
                <h4 style="margin-top:0; color:#e65100;">📢 顧問からの連絡</h4>
                <div id="noticeContent" style="font-size:14px; white-space:pre-wrap; color:#333;"></div>
            </div>

            <p style="font-size:12px; color:#666; text-align:center; margin-top:0;">日付をタップすると詳細が表示されます</p>
            <div id="calendar"></div>
            
            <div id="viewDetailArea" class="schedule-card" style="display:none; border-left: 5px solid #1565c0;">
                <h3 id="viewDetailTitle" style="color: #1565c0; margin-top:0;"></h3>
                <p id="viewDetailContent" style="font-size:14px; line-height:1.8; color:#444;"></p>
                <button class="btn btn-outline" style="padding:10px; margin-top:10px;" onclick="document.getElementById('viewDetailArea').style.display='none'">閉じる</button>
            </div>
        </div>

        <!-- 試合閲覧 -->
        <div id="tab-view-match" class="tab-content">
            <div class="filter-bar">
                <div class="filter-label">種別</div>
                <select id="matchFilter" class="filter-select" onchange="window.loadMatches()">
                    <option value="すべて">すべて</option>
                    <option value="公式戦">公式戦</option>
                    <option value="練習試合">練習試合</option>
                </select>
                <button class="filter-btn" onclick="window.reloadMatches()">🔄 更新</button>
            </div>
            <div id="matchListArea">読み込み中...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, onSnapshot, collection, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAAkU_rCv3qhu1hnYIKf2909eHsCGeFhko", authDomain: "share-basket-73d63.firebaseapp.com", projectId: "share-basket-73d63", storageBucket: "share-basket-73d63.firebasestorage.app", messagingSenderId: "46798696089", appId: "1:46798696089:web:0efca85070d97f5119d208" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // ⚡ 端末内キャッシュ（IndexedDB）を有効化：2回目以降はキャッシュから即表示し、差分だけ通信する
    let db;
    try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
    catch (e) { db = getFirestore(app); }
    // ⚡ 匿名ログインは裏で開始し、画面表示はそれを待たない
    const authReady = signInAnonymously(auth).catch(e => { console.error("接続エラー", e); });

    let calendar, globalSchedules = [], globalMorning = [], globalMatches = [];
    let schedulesMap = {}; let morningSet = new Set(); let remarksSet = new Set(); // 🚀 高速化用

    function getWeekday(dStr) { if(!dStr) return ''; const days = ['日','月','火','水','木','金','土']; return days[new Date(dStr).getDay()]; }

    document.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('basketball_viewer_logged_in') === 'true') { showMainScreen(); }
    });

    window.login = async () => { 
        const inputPass = document.getElementById('viewerPass').value.trim();
        if(!inputPass) return document.getElementById('msg-login').innerText = "パスワードを入力してください";
        await authReady;
        const snap = await getDoc(doc(db, "settings", "general"));
        let correctPass = snap.exists() && snap.data().viewerPassword ? snap.data().viewerPassword : "";

        if(!correctPass) return document.getElementById('msg-login').innerText = "パスワードが設定されていません。顧問の先生にお問い合わせください。";

        if(inputPass === correctPass) { localStorage.setItem('basketball_viewer_logged_in', 'true'); showMainScreen(); } 
        else { document.getElementById('msg-login').innerText = "パスワードが違います"; }
    };
    window.logout = () => { if(confirm("ログアウトしますか？")) { localStorage.removeItem('basketball_viewer_logged_in'); location.reload(); } };

    async function showMainScreen() {
        document.getElementById('loginArea').style.display = 'none'; document.getElementById('mainArea').style.display = 'flex';
        // ⚡ カレンダーの枠を先に出し、データは届き次第流し込む
        initCalendar();
        await loadAllData(); refreshCalendar(); window.loadMatches();
    }

    function applySettings(data) {
        if(data && data.noticeVisible && data.noticeText) {
            document.getElementById('noticeArea').style.display = 'block';
            document.getElementById('noticeContent').innerText = data.noticeText;
        } else {
            document.getElementById('noticeArea').style.display = 'none';
        }
    }

    function rebuildScheduleIndex() {
        schedulesMap = {}; remarksSet = new Set();
        globalSchedules.forEach(s => { 
            if (!schedulesMap[s.date]) schedulesMap[s.date] = []; 
            schedulesMap[s.date].push(s); 
            if(s.remarks) remarksSet.add(s.date);
        });
    }

    // ⚡ リアルタイム同期：毎回全件を取り直す代わりに、変更があった分だけ自動で反映する
    let liveReady = null, uiTimer = null; const pendingUi = new Set();
    function queueUi(name) { pendingUi.add(name); if (uiTimer) return; uiTimer = setTimeout(() => { uiTimer = null; const changed = new Set(pendingUi); pendingUi.clear(); onLiveChange(changed); }, 80); }
    function listen(name, target, apply) {
        return new Promise(resolve => {
            let first = true;
            onSnapshot(target, snap => { apply(snap); queueUi(name); if (first) { first = false; resolve(); } },
                err => { console.error(name, err); if (first) { first = false; resolve(); } });
        });
    }
    function startLive() {
        if (liveReady) return liveReady;
        liveReady = authReady.then(() => Promise.all([
            listen('settings', doc(db, "settings", "general"), s => applySettings(s.exists() ? s.data() : null)),
            listen('schedules', collection(db, "schedules"), s => { globalSchedules = s.docs.map(d=>({id:d.id, ...d.data()})); rebuildScheduleIndex(); }),
            listen('morning', collection(db, "morning"), s => { globalMorning = s.docs.map(d=>d.id); morningSet = new Set(globalMorning); }),
            listen('matches', query(collection(db, "matches"), orderBy("date", "desc")), s => { globalMatches = s.docs.map(d=>({id:d.id, ...d.data()})); })
        ]));
        return liveReady;
    }
    // 互換用：初回同期が終わるまで待つだけ（2回目以降は一瞬で終わる）
    async function loadAllData() { await startLive(); }

    function refreshCalendar() {
        if (!calendar) return;
        calendar.batchRendering(() => { calendar.removeAllEventSources(); calendar.addEventSource(getEvents()); });
        calendar.render();
    }
    // 開いている詳細や入力中の内容を消さないよう、閉じている時だけ自動で描き直す
    function isPristine(el) {
        if (!el || !el.classList.contains('active')) return false;
        if ([...el.querySelectorAll('[id^="details-"]')].some(x => x.style.display === 'block')) return false;
        return true;
    }
    function onLiveChange(changed) {
        if (changed.has('schedules') || changed.has('morning')) refreshCalendar();
        if (changed.has('matches') && isPristine(document.getElementById('tab-view-match'))) window.loadMatches();
    }

    window.openTab = function(evt, tabId) {
        document.querySelectorAll(".tab-content, .tab-button").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active"); evt.currentTarget.classList.add("active");
        if (tabId === 'tab-view-schedule' && calendar) calendar.render();
    };

    function getEvents() {
        return globalSchedules.map(d => {
            let timeStr = d.timeType === 'half' ? d.halfType : (d.startTime ? d.startTime + '〜' : '');
            let locStr = (d.location && d.location !== '都留高') ? d.location : '';
            let bg = d.eventType==='練習試合' ? '#ff9800' : (d.eventType==='公式戦'?'#f44336':'#4CAF50');
            return { id: d.id, title: `[${d.eventType||'練習'}] ${timeStr} ${locStr}`, start: d.date, allDay: true, backgroundColor: bg, borderColor: bg, extendedProps: d };
        });
    }

    function renderEventHtml(arg) {
        let d = arg.event.extendedProps;
        let timeStr = d.timeType === 'half' ? d.halfType : (d.startTime ? d.startTime + '〜' : '');
        let locStr = (d.location && d.location !== '都留高') ? d.location : '';
        let bg = d.eventType==='練習試合' ? '#ff9800' : (d.eventType==='公式戦'?'#f44336':'#4CAF50');
        let html = `<div style="background:${bg}; color:white; padding:2px; border-radius:3px; font-size:9px; text-align:center;"><div>[${d.eventType||'練習'}]</div>`;
        if(timeStr) html += `<div>${timeStr}</div>`; if(locStr) html += `<div>${locStr}</div>`; html += `</div>`; return { html: html };
    }

    function renderDayCell(arg) {
        const localStr = new Date(arg.date.getTime() - (arg.date.getTimezoneOffset()*60000)).toISOString().split('T')[0];
        const hasRem = remarksSet.has(localStr);
        const hasMorn = morningSet.has(localStr);
        let badges = ''; if(hasMorn) badges += '<span style="color:#ff9800; font-weight:bold; margin-left:4px;">〇</span>'; if(hasRem) badges += '<span style="color:red; font-weight:bold; margin-left:2px;">*</span>';
        return { html: `<div style="text-align:right; padding:2px;">${arg.dayNumberText.replace('日','')}${badges}</div>` };
    }

    function initCalendar() {
        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            height: 'auto', contentHeight: 'auto', initialView: 'dayGridMonth', locale: 'ja', headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
            events: getEvents(), eventContent: renderEventHtml, dayCellContent: renderDayCell,
            eventClick: function(info) {
                const d = info.event.extendedProps; document.getElementById('viewDetailArea').style.display = 'block'; 
                document.getElementById('viewDetailTitle').innerText = `📅 ${d.date} (${getWeekday(d.date)}) の詳細`;
                let timeStr = d.timeType === 'half' ? d.halfType : (d.startTime ? d.startTime + '〜' + (d.endTime||'') : '未定');
                let detail = `<b style="color:#1565c0;">【${d.eventType}】</b><br><br><b>時間:</b> ${timeStr}<br><b>場所:</b> ${d.location||'未定'}<br><b>備考:</b> ${d.remarks||'なし'}<br>`;
                if (morningSet.has(d.date)) detail += `<br><span style="color:#ff9800; font-weight:bold;">🌅 朝練あり(〇)</span>`;
                document.getElementById('viewDetailContent').innerHTML = detail; document.getElementById('viewDetailArea').scrollIntoView({ behavior: 'smooth' });
            }
        });
        calendar.render();
    }

    window.reloadMatches = async function() { document.getElementById('matchListArea').innerHTML = "最新読込中..."; await loadAllData(); window.loadMatches(); };
    window.toggleDetails = function(id) { const el = document.getElementById(`details-${id}`); el.style.display = el.style.display === 'none' ? 'block' : 'none'; };

    window.loadMatches = function() {
        const filter = document.getElementById('matchFilter').value; let html = "";
        globalMatches.forEach(m => {
            if(filter !== 'すべて' && m.type !== filter) return;
            const res = m.scoreOurs > m.scoreTheirs ? "<span style='color:red'>勝利</span>" : (m.scoreOurs < m.scoreTheirs ? "<span style='color:blue'>敗北</span>" : "引分");
            let imgHtml = m.imageUrl ? `<img src="${m.imageUrl}" loading="lazy" decoding="async" style="max-width:100%; border-radius:6px; margin-top:10px;">` : '';
            let linksHtml = ""; for(let i=1; i<=5; i++) if(m['linkUrl'+i]) linksHtml += `<a href="${m['linkUrl'+i]}" target="_blank" style="display:inline-block; margin-right:15px; margin-bottom:8px; color:#1565c0; font-weight:bold; text-decoration:none;">🔗 ${m['linkTitle'+i]||'リンク'+i}</a>`;
            if(linksHtml) linksHtml = `<div style="margin:10px 0; font-size:13px; background:#e3f2fd; padding:10px; border-radius:6px;">${linksHtml}</div>`;
            
            let statsHtml = "";
            if (m.stats && m.stats.length > 0 && m.statColumns) {
                statsHtml = `<div class='table-wrap'><table style="font-size:12px; margin-top:10px;"><tr><th style="width:40px;">背番</th><th>名前</th>`; m.statColumns.forEach(c => statsHtml += `<th>${c}</th>`); statsHtml += `</tr>`;
                m.stats.forEach(st => { statsHtml += `<tr><td>${st.number||'-'}</td><td style="text-align:left;">${st.name}</td>`; m.statColumns.forEach(c => statsHtml += `<td>${st.values[c]!==undefined?st.values[c]:''}</td>`); statsHtml += `</tr>`; }); statsHtml += "</table></div>";
            }

            let refs = m.reflections || [];
            refs.sort((a,b) => { if(a.role==='teacher' && b.role!=='teacher') return -1; if(a.role!=='teacher' && b.role==='teacher') return 1; return new Date(a.createdAt) - new Date(b.createdAt); });
            let commHtml = `<div id="details-${m.id}" style="display:none; margin-top:15px; border-top:2px dashed #ccc; padding-top:10px;">${linksHtml}${imgHtml}${statsHtml}`;
            refs.forEach(c => {
                let isT = c.role === 'teacher'; let dateStr = new Date(c.createdAt).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
                commHtml += `<div class="comment-box ${isT?'comment-teacher':''}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><strong style="color:${isT?'#1565c0':'#ff9800'}">${isT?'👔 ':''}${c.authorName}</strong><span style="font-size:10px; color:#999;">${dateStr}</span></div>
                    <div>${c.text}</div></div>`;
            });
            commHtml += `</div>`;

            html += `<div class="match-card"><div class="mc-head"><span class="mc-type ${m.type==='公式戦'?'official':''}">${m.type||'試合'}</span><span class="mc-date">${m.date} (${getWeekday(m.date)})</span></div>
                <div class="mc-name">${m.name||''}</div>
                <div class="scoreboard"><div class="sb-team ours"><div class="sb-name">都留高</div><div class="sb-score">${m.scoreOurs}</div></div><span class="sb-result ${m.scoreOurs > m.scoreTheirs ? 'win' : (m.scoreOurs < m.scoreTheirs ? 'lose' : 'draw')}">${m.scoreOurs > m.scoreTheirs ? 'WIN' : (m.scoreOurs < m.scoreTheirs ? 'LOSE' : 'DRAW')}</span><div class="sb-team"><div class="sb-name">${m.opponent}</div><div class="sb-score">${m.scoreTheirs}</div></div></div>
                <button class="btn btn-outline" style="width:100%; padding:10px; font-size:13px;" onclick="window.toggleDetails('${m.id}')">詳細・反省を見る (${refs.length}件) ▼</button>
                ${commHtml}</div>`;
        });
        document.getElementById('matchListArea').innerHTML = html || "データがありません";
    };
</script>
</body>
</html>
